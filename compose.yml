x-app-env: &app-env
  DB_HOST: mysql
  DB_PORT: 3306
  DB_NAME: ${DB_NAME:-crm_local}
  DB_USER: ${DB_USER:-crm}
  DB_PASSWORD: ${DB_PASSWORD:?Run node scripts/init-local.mjs or set a strong password}
  SESSION_SECRET: ${SESSION_SECRET:?Set a random session secret}
  NODE_ENV: ${NODE_ENV:-development}
  HOST: 0.0.0.0
  PORT: 3000
  APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
  TRUST_PROXY: ${TRUST_PROXY:-0}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
services:
  mysql:
    image: mysql:8.0.46
    environment: &db-env
      MYSQL_DATABASE: ${DB_NAME:-crm_local}
      MYSQL_USER: ${DB_USER:-crm}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1"']
      interval: 3s
      timeout: 5s
      retries: 60
    restart: unless-stopped
  migrate:
    build: {context: ./backend, target: production}
    environment: *app-env
    command: [node, dist/migrate.js]
    depends_on:
      mysql: {condition: service_healthy}
    restart: "no"
  backend:
    build: {context: ./backend, target: production}
    environment: *app-env
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:80"]
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
  mysql-test:
    profiles: [test]
    image: mysql:8.0.46
    environment:
      MYSQL_DATABASE: crm_readiness_test
      MYSQL_USER: crm_test
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1"']
      interval: 3s
      timeout: 5s
      retries: 60
  verify:
    profiles: [test]
    build: {context: ./backend, target: verification}
    environment:
      <<: *app-env
      NODE_ENV: test
      DB_HOST: mysql-test
      DB_NAME: crm_readiness_test
      DB_USER: crm_test
      APP_ORIGIN: http://localhost:5173
      COOKIE_SECURE: "false"
    depends_on:
      mysql-test: {condition: service_healthy}
    command: [sh, -c, "npm run typecheck:tests && npm run migrate:prod && npm run migrate:prod && npm run test:integration"]
  mysql-restore:
    profiles: [restore]
    image: mysql:8.0.46
    environment: *db-env
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1"']
      interval: 3s
      timeout: 5s
      retries: 60
volumes:
  mysql-data:
