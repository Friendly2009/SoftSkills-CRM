# Mounted by compose.production.yml. The certificate must cover the public domain.
limit_req_zone $binary_remote_addr zone=crm_auth:10m rate=5r/m;
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/crm-tls/fullchain.pem;
    ssl_certificate_key /etc/crm-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    client_body_timeout 15s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    location ~ ^/api/v1/auth/(login|register|invitations/accept)$ {
        limit_req zone=crm_auth burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/crm-upstream.conf;
    }
    location /api/ { include /etc/nginx/crm-upstream.conf; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location / { try_files $uri $uri/ /index.html; expires -1; }
}
