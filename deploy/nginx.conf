# Include inside nginx http {}; replace domain and certificate paths.
limit_req_zone $binary_remote_addr zone=crm_auth:10m rate=5r/m;
server {
    listen 80;
    server_name crm.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name crm.example.com;
    ssl_certificate /etc/letsencrypt/live/crm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    client_body_timeout 15s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location ~ ^/api/v1/auth/(login|register|invitations/accept)$ {
        limit_req zone=crm_auth burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/crm-proxy.conf;
    }
    location /api/v1/ { include /etc/nginx/snippets/crm-proxy.conf; }
    location /health/ { allow 127.0.0.1; deny all; include /etc/nginx/snippets/crm-proxy.conf; }
    # Install frontend separately; it is not wired by this task.
}
