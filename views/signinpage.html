<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Авторизация в систему</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f0f4f8;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .login-card {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        width: 100%;
        max-width: 400px;
        text-align: center;
      }

      h2 {
        color: #1a73e8;
        margin-bottom: 30px;
        font-weight: 600;
      }

      .input-group {
        text-align: left;
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #5f6368;
        font-size: 14px;
      }

      input {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        box-sizing: border-box;
        outline: none;
        transition: border-color 0.3s;
      }

      input:focus {
        border-color: #1a73e8;
      }

      button {
        width: 100%;
        padding: 12px;
        background-color: #1a73e8;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s;
        margin-top: 10px;
      }

      button:hover {
        background-color: #1557b0;
      }

      .support-link {
        margin-top: 25px;
        display: block;
        font-size: 13px;
        color: #70757a;
        text-decoration: none;
      }

      .support-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <h2>Авторизация в систему</h2>

      <form action="/login" method="POST">
        <div class="input-group">
          <label for="company">Название компании</label>
          <input
            type="text"
            id="company"
            name="company"
            placeholder="Введите название..."
            required
          />
        </div>

        <div class="input-group">
          <label for="key">Лицензионный ключ</label>
          <input
            type="password"
            id="key"
            name="key"
            placeholder="••••••••"
            required
          />
        </div>

        <button type="submit">Войти</button>
      </form>

      <a href="/support" class="support-link"
        >Нужна помощь? Напишите в поддержку</a
      >
    </div>
  </body>
</html>
