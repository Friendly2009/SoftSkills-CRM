<div class="menu-container">
  <!-- Кнопка + -->
  <button id="plusBtn" class="plus-button">+</button>

  <!-- Выпадающее меню -->
  <div id="dropdownMenu" class="dropdown-menu">
    <div class="menu-item">📝 Задача</div>
    <div class="menu-item">👤 Лид</div>
    <div class="menu-item">👥 Клиент</div>
    <hr />
    <div class="menu-item">💰 Доход</div>
    <div class="menu-item">🛒 Продажа</div>
  </div>
</div>

<style>
  .menu-container {
    position: relative; /* Важно: чтобы меню позиционировалось относительно этой точки */
    display: inline-block;
  }

  .plus-button {
    width: 40px;
    height: 40px;
    cursor: pointer;
    background: #f0f0f0;
    border: 1px solid #ccc;
    font-size: 24px;
  }

  .dropdown-menu {
    display: none; /* Скрыто по умолчанию */
    position: absolute; /* Не влияет на положение других элементов */
    top: 45px; /* Смещение вниз от кнопки */
    left: 0;
    background-color: white;
    min-width: 160px;
    box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.15);
    border: 1px solid #ddd;
    z-index: 1000; /* Чтобы быть поверх всего */
    padding: 8px 0;
  }

  .menu-item {
    padding: 10px 15px;
    cursor: pointer;
    font-family: sans-serif;
  }

  .menu-item:hover {
    background-color: #f5f5f5;
  }

  hr {
    border: 0;
    border-top: 1px solid #eee;
    margin: 5px 0;
  }
</style>
<script>
  const btn = document.getElementById("plusBtn");
  const menu = document.getElementById("dropdownMenu");

  // Показать при наведении на кнопку
  btn.addEventListener("mouseenter", () => {
    menu.style.display = "block";
  });

  // Скрыть, если мышка ушла с кнопки (но нужно учесть и само меню)
  btn.addEventListener("mouseleave", (e) => {
    // Проверяем, не перешли ли мы мышкой сразу на само меню
    if (!menu.contains(e.relatedTarget)) {
      menu.style.display = "none";
    }
  });

  // Чтобы меню не закрывалось, пока мы водим по нему самому
  menu.addEventListener("mouseleave", () => {
    menu.style.display = "none";
  });

  // Если мышка зашла на меню с кнопки — оно должно остаться видимым
  menu.addEventListener("mouseenter", () => {
    menu.style.display = "block";
  });
</script>
