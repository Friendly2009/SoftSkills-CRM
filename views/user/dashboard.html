<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cheap CRM Dashboard Layout</title>
    <link rel="stylesheet" href="/style/dashboard/custom.css" />
  </head>
  <body>
    <header class="alfa-header">
      <div class="header-left">
        <button class="burger-menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="logo">
          <img src="/img/index/brand-logo-2024.webp" alt="alfacrm" />
        </div>
      </div>

      <div class="header-center">
        <div class="icon-box">
          <img src="/img/user/dashboard/plus-icon.png" alt="+" />
        </div>
        <div class="icon-box">
          <img src="/img/user/dashboard/settings-icon.png" alt="settings" />
        </div>
        <div class="icon-box">
          <img src="/img/user/dashboard/email-icon.png" alt="" />
        </div>
        <div class="icon-box">
          <img src="/img/user/dashboard/phone-icon.png" alt="" />
        </div>
        <div class="icon-box">
          <img src="/img/user/dashboard/telegram-icon.png" alt="" />
        </div>
        <div class="icon-box">
          <img src="/img/user/dashboard/shop-icon.png" alt="" />
        </div>
        <div class="icon-box">
          <img src="/img/user/dashboard/notification-icon.png" alt="" />
        </div>
        <div class="search-container">
          <input type="text" placeholder="Поиск клиента" />
        </div>
      </div>
      <div class="header-right">
        <span class="user-name">kirill</span>
        <div class="user-avatar">
          <img src="/img/user/dashboard/empty-male.png" alt="" />
        </div>
      </div>
    </header>
    <main class="alfa-container">
      <aside class="sidebar">
        <nav class="sidebar-nav">
          <div class="nav-item active">
            <img src="" alt="" class="nav-icon" />
            <span>Аналитика</span>
          </div>
          <div class="nav-item">
            <img src="" alt="" class="nav-icon" />
            <span>Уроки</span>
          </div>
          <div class="nav-item">
            <img src="" alt="" class="nav-icon" />
            <span>Задачи</span>
          </div>
          <div class="nav-item">
            <img src="" alt="" class="nav-icon" />
            <span>Клиенты</span>
          </div>
        </nav>
      </aside>

      <section class="main-content">
        <div class="content-header">
          <div class="tabs">
            <button class="tab active">Рабочий стол</button>
            <button class="tab">Отчеты</button>
          </div>

          <div class="action-bar">
            <div class="btn-group">
              <button class="btn btn-blue">+ Добавить</button>
              <button class="btn btn-light-blue">Просить</button>
              <button class="btn btn-red">Удалить</button>
              <button class="btn btn-gray">Другое</button>
            </div>
            <button class="btn btn-green">Личный рабочий стол</button>
          </div>
        </div>

        <div class="dashboard-placeholder">
          <div class="placeholder-content">
            <img src="/img/user/dashboard/empty-red-icon.png" alt="map-icon" class="placeholder-icon" />
            <h2>На рабочем столе нет виджетов</h2>
            <p>Используйте кнопку «Добавить» для формирования рабочего стола</p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
