# Standalone production stack: docker compose -f compose.production.yml --env-file .env.production up -d --build
x-app: &app
  DB_HOST: mysql
  DB_PORT: 3306
  DB_NAME: ${DB_NAME:?Set DB_NAME}
  DB_USER: ${DB_USER:?Set DB_USER}
  DB_PASSWORD: ${DB_PASSWORD:?Set a random DB_PASSWORD}
  SESSION_SECRET: ${SESSION_SECRET:?Set a random SESSION_SECRET}
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: 3000
  APP_ORIGIN: ${APP_ORIGIN:?Set exact https origin}
  COOKIE_SECURE: "true"
  COOKIE_SAME_SITE: lax
  TRUST_PROXY: "1"
services:
  mysql:
    image: mysql:8.0.46
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME}
      MYSQL_USER: ${DB_USER:?Set DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a random MYSQL_ROOT_PASSWORD}
    volumes: [mysql-data:/var/lib/mysql]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 60
  migrate:
    build: {context: ./backend, target: production}
    environment: *app
    command: [node, dist/migrate.js]
    depends_on:
      mysql: {condition: service_healthy}
    restart: "no"
  backend:
    build: {context: ./backend, target: production}
    environment: *app
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/frontend-production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/frontend-upstream.conf:/etc/nginx/crm-upstream.conf:ro
      - ${TLS_CERT_DIR:?Set absolute certificate directory}:/etc/crm-tls:ro
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
  mysql-restore:
    profiles: [restore]
    image: mysql:8.0.46
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME}
      MYSQL_USER: ${DB_USER:?Set DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 60
volumes:
  mysql-data:
